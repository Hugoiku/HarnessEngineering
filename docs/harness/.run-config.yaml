# Run 工作记忆配置（个人场景保守默认）
version: 1

run:
  stale_after_days: 14
  summary:
    min_chars: 20
    # 语义门禁：调用 Claude Haiku 评审摘要质量（需要 ANTHROPIC_API_KEY）
    semantic_gate: true
    semantic_model: "claude-haiku-4-5"
    forbidden_substrings:
      - "TODO"
      - "待补充"
      - "TBD"
      - "placeholder"
      - "示例条目标题"

archive:
  default_layer: project
  default_type: guideline
  prompt_on_completed: true
